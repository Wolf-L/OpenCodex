name: Build installers and draft release

on:
  push:

# 默认只读取仓库内容，创建 Release 的写权限仅授予发布任务。
permissions:
  contents: read

jobs:
  metadata:
    name: Detect release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
      should_build_artifacts: ${{ steps.changes.outputs.should_build_artifacts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 需要比较 push 前后的提交，完整历史可以覆盖多提交 push 的变更范围。
          fetch-depth: 0

      - name: Detect version bump commit
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 仅匹配 HEAD commit 的标题，避免普通提交误触发发布流程。
          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
          commit_subject="${commit_subject%$'\r'}"

          if [[ "$commit_subject" =~ ^chore:\ bump\ version\ to\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            package_version="$(node --print "require('./package.json').version")"

            # 提交中的版本必须与安装包版本一致，防止创建错误的 Tag 和 Release。
            if [[ "$version" != "$package_version" ]]; then
              echo "Version mismatch: commit=$version, package.json=$package_version" >&2
              exit 1
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether artifact build is needed
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          # 发布提交必须继续构建安装包，保证 release 任务始终有完整产物可用。
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 新分支没有可比较的 before 提交时保守地执行构建，避免遗漏非文档变更。
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 比较失败时保守执行构建，避免因为 Git 历史异常而错误跳过安装包。
          if ! changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"; then
            echo "Unable to compare push commits; building artifacts" >&2
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_build_artifacts=false
          while IFS= read -r changed_file; do
            [[ -n "$changed_file" ]] || continue

            # 只有根目录 README.md 或 docs/ 下的文档变更时跳过安装包构建。
            if [[ "$changed_file" != "README.md" && "$changed_file" != docs/* ]]; then
              should_build_artifacts=true
              break
            fi
          done <<< "$changed_files"

          echo "should_build_artifacts=$should_build_artifacts" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS installer (${{ matrix.arch }})
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true' || needs.metadata.outputs.should_build_artifacts == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ad-hoc signed DMG installers
        run: |
          pnpm run build
          # 安装包由后续 job 统一发布，禁止 electron-builder 在 CI 中自动上传。
          pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --config.mac.identity=- --publish never

      - name: Verify macOS signatures
        shell: bash
        run: |
          # 每个矩阵任务只应生成当前架构的一个顶层应用包。
          app_count=0
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "$app_path"
            ((app_count += 1))
          done < <(find release -mindepth 2 -maxdepth 2 -type d -name '*.app' -print0)

          if (( app_count != 1 )); then
            echo "Unexpected application bundles: $app_count" >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          # 外层 Artifact 名称携带完整提交哈希，内部 DMG 文件名保持不变。
          name: opencodex-macos-${{ matrix.arch }}-${{ github.sha }}
          path: release/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true' || needs.metadata.outputs.should_build_artifacts == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: |
          pnpm run build
          # 安装包由后续 job 统一发布，禁止 electron-builder 在 CI 中自动上传。
          pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          # 外层 Artifact 名称携带完整提交哈希，内部 EXE 文件名保持不变。
          name: opencodex-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux installers (${{ matrix.arch }})
    needs: metadata
    if: needs.metadata.outputs.is_release == 'true' || needs.metadata.outputs.should_build_artifacts == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Verify native Linux architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          # ARM64 产物必须由原生 ARM64 Node 构建，避免误用 x64 依赖或模拟器结果。
          node -e "if (process.platform !== 'linux' || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test Linux deployment support
        run: |
          pnpm run build
          # 这里只测试 Linux 适配，既不启动真实账户，也不掩盖已有的全量测试基线问题。
          node --test gateway/test/gateway-listen.test.cjs gateway/test/linux-runtime.test.cjs gateway/test/linux-deployment.test.cjs gateway/test/linux-packaging.test.cjs

      - name: Build DEB and portable archive
        run: |
          # Android/chroot 环境优先使用无需 FUSE 的压缩包；仅后续 release job 可以发布。
          pnpm exec electron-builder --linux deb tar.gz --${{ matrix.arch }} --publish never

      - name: Verify both Linux package formats
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          # DEB 采用 Debian 的 amd64 名称，压缩包仍使用 Electron 的 x64；两种产物都必须存在。
          version="$(node --print "require('./package.json').version")"
          test -s "release/OpenCodex-${version}-linux-${DEB_ARCH}.deb"
          test -s "release/OpenCodex-${version}-linux-${BUILD_ARCH}.tar.gz"
          test "$(dpkg-deb --field "release/OpenCodex-${version}-linux-${DEB_ARCH}.deb" Architecture)" = "$DEB_ARCH"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: opencodex-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*-linux-${{ matrix.deb_arch }}.deb
            release/*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Create draft release
    if: needs.metadata.outputs.is_release == 'true'
    needs:
      - metadata
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=(release-assets/*.dmg)
          exe_files=(release-assets/*.exe)
          deb_files=(release-assets/*-linux-*.deb)
          tar_files=(release-assets/*-linux-*.tar.gz)

          # 必须同时具备 macOS 双架构、Windows、Linux 双架构的完整产物。
          if (( ${#dmg_files[@]} != 2 || ${#exe_files[@]} != 1 || ${#deb_files[@]} != 2 || ${#tar_files[@]} != 2 )); then
            echo "Unexpected assets: ${#dmg_files[@]} DMG, ${#exe_files[@]} EXE, ${#deb_files[@]} DEB, ${#tar_files[@]} tar.gz" >&2
            exit 1
          fi

          # 不能仅检查数量，两个同架构包也不算完整的 Linux 发布。
          for arch in x64 arm64; do
            for ext in deb tar.gz; do
              # DEB 的架构名由打包器转换为 Debian 标准，不能按 tar.gz 的 x64 名称寻找。
              asset_arch="$arch"
              if [[ "$ext" == "deb" && "$arch" == "x64" ]]; then asset_arch=amd64; fi
              expected="release-assets/OpenCodex-${RELEASE_VERSION}-linux-${asset_arch}.${ext}"
              if [[ ! -f "$expected" ]]; then
                echo "Missing Linux asset: $expected" >&2
                exit 1
              fi
            done
          done

      - name: Create or update draft release
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.exe release-assets/*-linux-*.deb release-assets/*-linux-*.tar.gz)

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            # 重跑流水线时仅更新已有草稿，避免覆盖已经正式发布的 Release。
            is_draft="$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_VERSION already exists and is not a draft" >&2
              exit 1
            fi

            gh release edit "$RELEASE_VERSION" --title "v$RELEASE_VERSION" --draft=true
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_VERSION" "${assets[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "v$RELEASE_VERSION" \
              --notes ""
          fi
